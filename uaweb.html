<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra AI Pro Web v1.0 Beta</title>
<meta name="description" content="Ultra AI Pro Web: chat con IA, imágenes, audio y TTS en tu navegador. Creado por Alejandro Eng.">
<link rel="icon" type="image/png" href="URL_DEL_ICONO">

<style>
:root {
    --fondo: #0F172A;
    --tarjeta: #1E293B;
    --texto: #E2E8F0;
    --subtext: #94A3B8;
    --acento: #38BDF8;
    --verde: #22C55E;
    --rojo: #EF4444;
    --ambar: #F59E0B;
    --violeta: #8B5CF6;
    --burbujaUser: #2C3E50;
}

[data-theme="light"] {
    --fondo: #F1F5F9;
    --tarjeta: #FFFFFF;
    --texto: #0F172A;
    --subtext: #64748B;
    --acento: #0284C7;
    --verde: #16A34A;
    --rojo: #DC2626;
    --ambar: #D97706;
    --burbujaUser: #DBEAFE;
}

[data-theme="midnight"] {
    --fondo: #050B1E;
    --tarjeta: #0F1B3D;
    --texto: #E0E7FF;
    --subtext: #818CF8;
    --acento: #818CF8;
    --verde: #34D399;
    --rojo: #F87171;
    --ambar: #FBBF24;
    --burbujaUser: #1E2A5A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
}

/* ===== LAYOUT PRINCIPAL ===== */
.app {
    display: flex;
    height: 100vh;
    position: relative;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 280px;
    background: var(--tarjeta);
    border-right: 1px solid rgba(148, 163, 184, 0.1);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    transition: transform 0.3s ease;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 199;
    display: none;
    opacity: 0;
    transition: opacity 0.3s;
}

.sidebar-overlay.open {
    display: block;
    opacity: 1;
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.sidebar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--texto);
}

.sidebar-close {
    background: none;
    border: none;
    color: var(--subtext);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.2s;
}

.sidebar-close:hover {
    background: var(--fondo);
    color: var(--texto);
}

.conv-list {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 12px;
}

.conv-list::-webkit-scrollbar { width: 6px; }
.conv-list::-webkit-scrollbar-track { background: transparent; }
.conv-list::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }

.conv-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-radius: 10px;
    background: var(--fondo);
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
}

.conv-item:hover {
    border-color: var(--acento);
}

.conv-item.active {
    border-color: var(--acento);
    background: rgba(56, 189, 248, 0.1);
}

.conv-info {
    flex: 1;
    min-width: 0;
}

.conv-name {
    font-size: 13px;
    color: var(--texto);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.conv-meta {
    font-size: 10px;
    color: var(--subtext);
    margin-top: 2px;
}

.conv-delete {
    background: var(--rojo);
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.2s;
}

.conv-delete:hover {
    transform: scale(1.1);
}

.sidebar-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
    font-family: inherit;
}

.sidebar-btn.danger {
    background: var(--rojo);
    color: white;
}

.sidebar-btn.danger:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}

.sidebar-btn.cancel {
    background: var(--fondo);
    color: var(--texto);
}

/* ===== ÁREA PRINCIPAL ===== */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--tarjeta);
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
}

.menu-btn {
    background: var(--acento);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
}

.header-title {
    flex: 1;
    min-width: 0;
}

.header-title h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--texto);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-title p {
    font-size: 11px;
    color: var(--subtext);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-btn {
    background: var(--acento);
    color: white;
    border: none;
    height: 40px;
    min-width: 40px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.header-btn.verde { background: var(--verde); }
.header-btn.rojo { background: var(--rojo); }

.header-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
}

/* ===== CHAT ===== */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.chat::-webkit-scrollbar { width: 8px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }

.system-msg {
    text-align: center;
    font-size: 12px;
    color: var(--subtext);
    padding: 6px 12px;
}

.msg-row {
    display: flex;
    gap: 8px;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.msg-row.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
}

.bubble.user {
    background: var(--burbujaUser);
    border: 1px solid var(--acento);
    color: var(--texto);
}

.bubble.bot {
    background: var(--tarjeta);
    border: 1px solid var(--verde);
    color: var(--texto);
}

.bubble.error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--rojo);
    color: var(--rojo);
}

.bubble:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.bubble img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
    display: block;
}

.bubble audio {
    width: 100%;
    margin-top: 8px;
}

.typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--acento);
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 2px;
}

@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}

/* ===== INPUT ===== */
.input-area {
    padding: 12px 16px;
    background: var(--tarjeta);
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    position: relative;
}

.file-btn {
    background: var(--tarjeta);
    border: 1px solid var(--acento);
    color: var(--texto);
    width: 52px;
    height: 52px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.file-btn:hover {
    background: var(--fondo);
    transform: scale(1.05);
}

.file-btn.rotated {
    transform: rotate(45deg);
}

.input-text {
    flex: 1;
    min-height: 52px;
    max-height: 150px;
    padding: 14px 16px;
    background: var(--fondo);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    color: var(--texto);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border 0.2s;
}

.input-text:focus {
    border-color: var(--acento);
}

.input-text::placeholder {
    color: var(--subtext);
}

.send-btn {
    background: var(--acento);
    color: white;
    border: none;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(56, 189, 248, 0.5);
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ===== MENÚ FILE ===== */
.file-menu {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) scale(0.5);
    background: var(--tarjeta);
    border: 1px solid var(--acento);
    border-radius: 20px;
    padding: 14px;
    display: flex;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
}

.file-menu.open {
    opacity: 1;
    pointer-events: all;
    transform: translateX(-50%) scale(1);
}

.file-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 70px;
    padding: 10px 4px;
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    transform: translateX(0) scale(0.5);
    opacity: 0;
}

.file-menu.open .file-option {
    transform: translateX(0) scale(1);
    opacity: 1;
}

.file-option.camara { background: var(--acento); transition-delay: 0.06s; }
.file-option.audio { background: var(--verde); transition-delay: 0.1s; }
.file-option.tts { background: var(--ambar); transition-delay: 0.14s; }
.file-option.stop { background: var(--rojo); transition-delay: 0.18s; }

.file-menu.open .file-option.camara { transform: translateX(0); }
.file-menu.open .file-option.audio { transform: translateX(0); }
.file-menu.open .file-option.tts { transform: translateX(0); }
.file-menu.open .file-option.stop { transform: translateX(0); }

.file-option:hover {
    transform: scale(1.1) !important;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.file-option .icon {
    font-size: 22px;
}

.file-option.recording {
    background: var(--rojo) !important;
    animation: pulseRec 1s infinite;
}

@keyframes pulseRec {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* ===== RECORDING OVERLAY ===== */
.recording-overlay {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--tarjeta);
    border: 2px solid var(--rojo);
    border-radius: 20px;
    padding: 16px 24px;
    text-align: center;
    z-index: 300;
    display: none;
    animation: slideUp 0.3s;
}

.recording-overlay.open {
    display: block;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.recording-timer {
    font-size: 20px;
    font-weight: 700;
    color: var(--rojo);
    margin-bottom: 4px;
}

.recording-hint {
    font-size: 12px;
    color: var(--subtext);
}

/* ===== MODAL SETTINGS ===== */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 400;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.open {
    display: flex;
}

.modal {
    background: var(--fondo);
    border-radius: 20px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.3s;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.modal h2 {
    font-size: 22px;
    color: var(--texto);
    margin-bottom: 8px;
}

.modal-sub {
    font-size: 12px;
    color: var(--subtext);
    margin-bottom: 20px;
}

.modal-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--subtext);
    margin: 16px 0 8px;
}

.modal-select, .modal-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--tarjeta);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    color: var(--texto);
    font-size: 14px;
    font-family: inherit;
    outline: none;
}

.modal-select:focus, .modal-input:focus {
    border-color: var(--acento);
}

.modal-slider {
    width: 100%;
    margin: 8px 0;
    accent-color: var(--acento);
}

.modal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
}

.modal-row:last-child {
    border-bottom: none;
}

.modal-row label {
    font-size: 14px;
    color: var(--texto);
}

.modal-switch {
    width: 48px;
    height: 26px;
    appearance: none;
    background: var(--tarjeta);
    border-radius: 13px;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
}

.modal-switch:checked {
    background: var(--verde);
}

.modal-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    transition: transform 0.3s;
}

.modal-switch:checked::after {
    transform: translateX(22px);
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
}

.modal-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
}

.modal-btn.primary {
    background: var(--acento);
    color: white;
}

.modal-btn.secondary {
    background: var(--tarjeta);
    color: var(--texto);
}

.modal-btn:hover {
    transform: translateY(-2px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .sidebar { width: 100%; }
    .bubble { max-width: 85%; }
    .file-option { width: 60px; }
    .file-option .icon { font-size: 18px; }
    .file-option { font-size: 10px; }
}
</style>
</head>
<body>

<div class="app">

    <!-- OVERLAY SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebarTitle">Conversaciones</div>
            <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="conv-list" id="convList"></div>
        <button class="sidebar-btn danger" onclick="confirmDeleteAll()" id="deleteAllBtn">🗑️ Borrar todas</button>
        <button class="sidebar-btn cancel" onclick="toggleSidebar()" id="closeMenuBtn">Cerrar menú</button>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">
            <button class="menu-btn" onclick="toggleSidebar()">⋮</button>
            <div class="header-title">
                <h1 id="headerTitle">Ultra AI Pro</h1>
                <p id="headerStatus">Modelo: Nemotron Nano Omni</p>
            </div>
            <button class="header-btn verde" onclick="newConversation()" id="newChatBtn">✚</button>
            <button class="header-btn" onclick="toggleDeepThink()" id="deepThinkBtn">🤔</button>
            <button class="header-btn" onclick="openSettings()">⚙️</button>
        </header>

        <!-- CHAT -->
        <div class="chat" id="chat"></div>

        <!-- INPUT -->
        <div class="input-area">
            <button class="file-btn" id="fileBtn" onclick="toggleFileMenu()">📎</button>
            <textarea class="input-text" id="inputText" placeholder="Escribe tu mensaje..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>

            <!-- MENÚ FILE -->
            <div class="file-menu" id="fileMenu">
                <button class="file-option camara" onclick="pickImage()">
                    <span class="icon">📷</span>
                    <span>Cámara</span>
                </button>
                <button class="file-option audio" id="audioBtn">
                    <span class="icon" id="audioIcon">🎤</span>
                    <span id="audioLabel">Audio</span>
                </button>
                <button class="file-option tts" onclick="speakLastBot()">
                    <span class="icon">🔊</span>
                    <span>TTS</span>
                </button>
                <button class="file-option stop" onclick="stopSpeaking()">
                    <span class="icon">⏹️</span>
                    <span>Parar</span>
                </button>
            </div>
        </div>
    </main>
</div>

<!-- INPUT FILE OCULTO -->
<input type="file" id="imageInput" accept="image/*" style="display:none;">

<!-- OVERLAY GRABACIÓN -->
<div class="recording-overlay" id="recordingOverlay">
    <div class="recording-timer" id="recordingTimer">🔴 00:00</div>
    <div class="recording-hint">Suelta para enviar</div>
</div>

<!-- MODAL SETTINGS -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h2 id="settingsTitle">Configuración</h2>
        <p class="modal-sub" id="settingsSub">Ultra AI Pro Web v1.0 Beta · Creado por Alejandro Eng</p>

        <label class="modal-label" id="langLabel">Idioma</label>
        <select class="modal-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
        </select>

        <label class="modal-label" id="themeLabel">Tema</label>
        <select class="modal-select" id="themeSelect" onchange="changeTheme(this.value)">
            <option value="dark">🌙 Oscuro (DataMonitor)</option>
            <option value="light">☀️ Claro</option>
            <option value="midnight">🌌 Azul medianoche</option>
        </select>

        <label class="modal-label" id="modelLabel">Modelo</label>
        <select class="modal-select" id="modelSelect" onchange="changeModel(this.value)">
            <option value="0">Nemotron Nano Omni</option>
            <option value="1">Ling 3.0 Flash VL</option>
            <option value="2">Dots3-Note</option>
        </select>

        <label class="modal-label" id="tempLabel">Temperatura: <span id="tempValue">0.7</span></label>
        <input type="range" class="modal-slider" id="tempSlider" min="0" max="2" step="0.1" value="0.7"
               oninput="document.getElementById('tempValue').textContent = this.value">

        <div class="modal-row">
            <label id="vibLabel">Vibración al responder</label>
            <input type="checkbox" class="modal-switch" id="vibSwitch" checked>
        </div>
        <div class="modal-row">
            <label id="ttsLabel">Leer respuestas automáticamente</label>
            <input type="checkbox" class="modal-switch" id="ttsSwitch">
        </div>
        <div class="modal-row">
            <label id="zdrLabel">Privacidad ZDR (sin retención)</label>
            <input type="checkbox" class="modal-switch" id="zdrSwitch" checked>
        </div>

        <div class="modal-actions">
            <button class="modal-btn primary" onclick="saveSettings()" id="saveBtn">Guardar</button>
            <button class="modal-btn secondary" onclick="closeSettings()" id="cancelBtn">Cancelar</button>
        </div>
    </div>
</div>

<script>
// ============================================
// CONFIGURACIÓN
// ============================================
const API_KEY_PARTS = [
    "c2stb3ItdjEt",
    "OTRhY2QyMDE1ZDEyNTdhMTZi",

}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
}

function refreshSidebar() {
    const list = document.getElementById('convList');
    list.innerHTML = '';

    if (conversations.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--subtext);font-size:13px;padding:20px;">' + S().noConversations + '</div>';
        return;
    }

    conversations.forEach((conv, index) => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (conv.id === currentConvId ? ' active' : '');
        item.onclick = (e) => {
            if (e.target.classList.contains('conv-delete')) return;
            selectConversation(conv.id);
        };

        item.innerHTML = `
            <div class="conv-info">
                <div class="conv-name">💬 ${escapeHtml(conv.title)}</div>
                <div class="conv-meta">${conv.messages.length}${S().messagesLabel}${conv.timestamp}</div>
            </div>
            <button class="conv-delete" onclick="event.stopPropagation(); confirmDeleteOne(${index})">✕</button>
        `;

        list.appendChild(item);
    });
}

function selectConversation(id) {
    currentConvId = id;
    refreshChat();
    refreshSidebar();
    if (window.innerWidth < 768) toggleSidebar();
}

function newConversation() {
    createNewConversation();
    refreshChat();
    refreshSidebar();
}

function createNewConversation() {
    const id = 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    const now = new Date();
    const ts = now.toLocaleDateString() + ' ' + now.toLocaleTimeString().slice(0, 5);

    const conv = {
        id,
        title: S().newConversation,
        timestamp: ts,
        messages: []
    };

    conversations.unshift(conv);
    currentConvId = id;
    saveConversations();
}

function getCurrentConversation() {
    return conversations.find(c => c.id === currentConvId);
}

function saveConversations() {
    localStorage.setItem('conversations', JSON.stringify(conversations));
}

function confirmDeleteOne(index) {
    if (!confirm(S().deleteConv)) return;

    const conv = conversations[index];
    conversations.splice(index, 1);

    if (conv.id === currentConvId) {
        if (conversations.length === 0) createNewConversation();
        else currentConvId = conversations[0].id;
        refreshChat();
    }

    saveConversations();
    refreshSidebar();
}

function confirmDeleteAll() {
    if (conversations.length === 0) return;
    if (!confirm(S().deleteAllConvs)) return;

    conversations = [];
    createNewConversation();
    refreshChat();
    refreshSidebar();
    toggleSidebar();
}

// ============================================
// CHAT
// ============================================
function refreshChat() {
    const chat = document.getElementById('chat');
    chat.innerHTML = '';

    const conv = getCurrentConversation();
    if (!conv) return;

    if (conv.messages.length === 0) {
        addSystemMessage(S().emptyChat);
        addSystemMessage(S().model + ": " + MODELS[currentModelIndex].name);
        addSystemMessage("📎 · 🎤 · 📷 · 🔊 · 🧠");
        return;
    }

    conv.messages.forEach(msg => {
        if (msg.type === 'image') {
            addImageMessage(msg.content, msg.isUser);
        } else if (msg.type === 'audio') {
            addAudioMessage(msg.content, msg.isUser);
        } else {
            addMessage(msg.content, msg.isUser);
        }
    });
}

function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    document.getElementById('chat').appendChild(div);
    scrollToBottom();
}

function addMessage(text, isUser) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
    bubble.textContent = text;
    bubble.onclick = () => {
        navigator.clipboard.writeText(text);
        showToast(S().copy);
    };

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);
    scrollToBottom();
    return bubble;
}

function addImageMessage(imageData, isUser) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');

    const img = document.createElement('img');
    img.src = imageData;
    bubble.appendChild(img);

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);
    scrollToBottom();
}

function addAudioMessage(audioData, isUser) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = audioData;
    bubble.appendChild(audio);

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);

function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingIndicator';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = S().thinking;

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);
    scrollToBottom();
}

function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function addMessageWithTypingEffect(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';

    const textSpan = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';

    bubble.appendChild(textSpan);
    bubble.appendChild(cursor);

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);

    let i = 0;
    const speed = 20;

    function type() {
        if (i < text.length) {
            textSpan.textContent += text.charAt(i);
            i++;
            scrollToBottom();
            setTimeout(type, speed);
        } else {
            cursor.remove();
            bubble.onclick = () => {
                navigator.clipboard.writeText(text);
                showToast(S().copy);
            };
        }
    }

    type();
    return bubble;
}

function scrollToBottom() {
    const chat = document.getElementById('chat');
    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}

function setupInputAutoResize() {
    const ta = document.getElementById('inputText');
    ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 150) + 'px';
    });
    ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
}

async function sendMessage() {
    if (isProcessing) return;

    const input = document.getElementById('inputText');
    const text = input.value.trim();
    if (!text) return;

    const conv = getCurrentConversation();
    if (conv.messages.length === 0) {
        conv.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
        document.getElementById('headerTitle').textContent = conv.title;
    }

    conv.messages.push({ content: text, isUser: true, type: 'text', timestamp: Date.now() });
    saveConversations();
    addMessage(text, true);
    input.value = '';
    input.style.height = 'auto';

    await callAI(text);
}

// ============================================
// API
// ============================================
async function callAI(userMessage) {
    isProcessing = true;
    document.getElementById('sendBtn').disabled = true;
    addTypingIndicator();

    try {
        const model = MODELS[currentModelIndex].id;

        let systemPrompt;
        if (currentLang === 'en') {
            systemPrompt = "You are Ultra AI Pro, a helpful, friendly and accurate assistant. Reply in the same language the user writes in.";
        } else if (currentLang === 'fr') {
            systemPrompt = "Tu es Ultra AI Pro, un assistant utile, amical et précis. Réponds dans la même langue que l'utilisateur.";
        } else {
            systemPrompt = "Eres Ultra AI Pro, un asistente útil, amable y preciso. Responde en el mismo idioma en el que te hablen.";
        }

        if (deepThink) {
            systemPrompt += "\n\n" + S().thinkingPrompt;
        }

        const body = {
            model: model,
            messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userMessage }
            ],
            max_tokens: 1000,
            temperature: temperature
        };

        if (zdrEnabled) body.provider = { zdr: true };

        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getApiKey(),
                'HTTP-Referer': 'https://ultraai.app',
                'X-Title': 'Ultra AI Pro Web'
            },
            body: JSON.stringify(body)
        });

        removeTypingIndicator();

        if (!response.ok) {
            let errMsg = S().errorGeneric + ' ' + response.status;
            if (response.status === 401) errMsg = S().errorApiKey;
            else if (response.status === 404) errMsg = S().errorModel;
            else if (response.status === 429) errMsg = S().errorRate;
            showError(errMsg);
            return;
        }

        const data = await response.json();
        const aiText = data.choices[0].message.content;

        const conv = getCurrentConversation();
        conv.messages.push({ content: aiText, isUser: false, type: 'text', timestamp: Date.now() });
        saveConversations();

        addMessageWithTypingEffect(aiText);

        if (vibrationEnabled && navigator.vibrate) navigator.vibrate(30);
        if (autoTts) speakText(aiText);

    } catch (e) {
        removeTypingIndicator();
        showError(e.message);
    } finally {
        isProcessing = false;
        document.getElementById('sendBtn').disabled = false;
    }
}

function showError(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble error';
    bubble.textContent = '⚠️ ' + msg;

    row.appendChild(bubble);
    document.getElementById('chat').appendChild(row);
    scrollToBottom();
}

// ============================================
// AUDIO (mantener pulsado)
// ============================================
function setupAudioButton() {
    const btn = document.getElementById('audioBtn');

    btn.addEventListener('mousedown', startRecording);
    btn.addEventListener('mouseup', stopRecordingAndSend);
    btn.addEventListener('mouseleave', () => { if (isRecording) cancelRecording(); });

    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecordingAndSend(); });
    btn.addEventListener('touchcancel', (e) => { e.preventDefault(); cancelRecording(); });
}

async function startRecording() {
    if (isRecording) return;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.start();
        isRecording = true;
        recordingSeconds = 0;

        document.getElementById('audioIcon').textContent = '⏹️';
        document.getElementById('audioLabel').textContent = 'Grabando';
        document.getElementById('audioBtn').classList.add('recording');

        document.getElementById('recordingOverlay').classList.add('open');
        document.getElementById('recordingTimer').textContent = '🔴 00:00';

        recordingInterval = setInterval(() => {
            recordingSeconds++;
            const min = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
            const sec = String(recordingSeconds % 60).padStart(2, '0');
            document.getElementById('recordingTimer').textContent = `🔴 ${min}:${sec}`;
        }, 1000);

    } catch (e) {
        showToast('❌ Micrófono no disponible');
    }
}

function stopRecordingAndSend() {
    if (!isRecording) return;
    isRecording = false;

    if (recordingInterval) clearInterval(recordingInterval);
    document.getElementById('recordingOverlay').classList.remove('open');

    document.getElementById('audioIcon').textContent = '🎤';
    document.getElementById('audioLabel').textContent = 'Audio';
    document.getElementById('audioBtn').classList.remove('recording');

    mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = (e) => {
            const dataUrl = e.target.result;
            const conv = getCurrentConversation();
            conv.messages.push({ content: dataUrl, isUser: true, type: 'audio', timestamp: Date.now() });
            saveConversations();
            addAudioMessage(dataUrl, true);

            addSystemMessage(S().recognizing);
            addSystemMessage("(El audio fue enviado)");
        };
        reader.readAsDataURL(blob);

        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.stop();
}

function cancelRecording() {
    if (!isRecording) return;
    isRecording = false;

    if (recordingInterval) clearInterval(recordingInterval);
    document.getElementById('recordingOverlay').classList.remove('open');

    document.getElementById('audioIcon').textContent = '🎤';
    document.getElementById('audioLabel').textContent = 'Audio';
    document.getElementById('audioBtn').classList.remove('recording');

    mediaRecorder.onstop = () => {
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.stop();
}

// ============================================
// TTS
// ============================================
let currentUtterance = null;

function speakText(text) {
    if (!window.speechSynthesis) {
        showToast('TTS no disponible');
        return;
    }

    window.speechSynthesis.cancel();

    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.lang = currentLang === 'en' ? 'en-US' : currentLang === 'fr' ? 'fr-FR' : 'es-ES';
    currentUtterance.rate = 1;
    currentUtterance.pitch = 1;

    window.speechSynthesis.speak(currentUtterance);
}

function speakLastBot() {
    closeFileMenu();
    const conv = getCurrentConversation();
    if (!conv) return;

    for (let i = conv.messages.length - 1; i >= 0; i--) {
        const m = conv.messages[i];
        if (!m.isUser && m.type === 'text') {
            speakText(m.content);
            return;
        }
    }
    showToast(S().noMsgsToRead);
}

function stopSpeaking() {
    closeFileMenu();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// ============================================
// DEEPTHINK
// ============================================
function toggleDeepThink() {
    deepThink = !deepThink;
    localStorage.setItem('deepThink', deepThink);

    const btn = document.getElementById('deepThinkBtn');
    btn.textContent = deepThink ? '🧠' : '🤔';
    btn.style.background = deepThink ? 'var(--verde)' : 'var(--subtext)';

    showToast(deepThink ? '🧠 DeepThink ON' : '🤔 DeepThink OFF');
}

// ============================================
// SETTINGS MODAL
// ============================================
function openSettings() {
    document.getElementById('settingsModal').classList.add('open');
    document.getElementById('langSelect').value = currentLang;
    document.getElementById('themeSelect').value = currentTheme;
    document.getElementById('modelSelect').value = currentModelIndex;
    document.getElementById('tempSlider').value = temperature;
    document.getElementById('tempValue').textContent = temperature.toFixed(1);
    document.getElementById('vibSwitch').checked = vibrationEnabled;
    document.getElementById('ttsSwitch').checked = autoTts;
    document.getElementById('zdrSwitch').checked = zdrEnabled;
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
    temperature = parseFloat(document.getElementById('tempSlider').value);
    vibrationEnabled = document.getElementById('vibSwitch').checked;
    autoTts = document.getElementById('ttsSwitch').checked;
    zdrEnabled = document.getElementById('zdrSwitch').checked;

    localStorage.setItem('temperature', temperature);
    localStorage.setItem('vibration', vibrationEnabled);
    localStorage.setItem('autoTts', autoTts);
    localStorage.setItem('zdr', zdrEnabled);

    closeSettings();
    showToast('✅ Guardado');
}

// ============================================
// UTILIDADES
// ============================================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--tarjeta);
        color: var(--texto);
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid var(--acento);
        z-index: 500;
        font-size: 14px;
        animation: slideUp 0.3s;
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// ============================================
// ARRANQUE
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    init();

    // Estado inicial del botón DeepThink
    const btn = document.getElementById('deepThinkBtn');
    btn.textContent = deepThink ? '🧠' : '🤔';
    btn.style.background = deepThink ? 'var(--verde)' : 'var(--subtext)';
});

// Cerrar menú File al hacer click fuera
document.addEventListener('click', (e) => {
    const menu = document.getElementById('fileMenu');
    const btn = document.getElementById('fileBtn');
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
        closeFileMenu();
    }
});
</script>
